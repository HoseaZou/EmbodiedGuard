name: Verify competition V14
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e "./EmbodiedGuard-v14[public,test]"
      - run: python tools/verify_release.py
      - run: python -m pytest -q EmbodiedGuard-v14/tests
      - run: python tools/smoke_mcp.py
